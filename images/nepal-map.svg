<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" fill="none" class="nepal-vector-map" role="img" aria-label="Interactive map of Nepal highlighting 7 provinces and SAAN alumni hubs">
  <defs>
    <filter id="mapShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#102A43" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Subtle Grid / Himalayan Topography Contours -->
  <g opacity="0.15" stroke="#1565C0" stroke-width="0.8" stroke-dasharray="3 3">
    <path d="M 50,80 Q 250,50 450,70 T 850,90" fill="none" />
    <path d="M 60,140 Q 280,100 500,120 T 900,150" fill="none" />
    <path d="M 80,200 Q 300,170 520,190 T 920,220" fill="none" />
  </g>

  <!-- Province Polygons (Stylized Geographic Geometry) -->
  <g filter="url(#mapShadow)" class="provinces-group">
    
    <!-- 1. Sudurpashchim Province (Far West) -->
    <path id="prov-sudurpashchim" class="province-path" data-province="sudurpashchim" data-name="Sudurpashchim Province" data-districts="9" data-center="Dhangadhi / Dadeldhura" data-lead="Far-Western Regional Hub"
      d="M 55,145 L 95,95 L 145,85 L 175,130 L 155,200 L 125,230 L 70,220 L 45,185 Z"
      fill="#E9EEF3" stroke="#CBD2D9" stroke-width="2" />

    <!-- 2. Karnali Province -->
    <path id="prov-karnali" class="province-path" data-province="karnali" data-name="Karnali Province" data-districts="10" data-center="Birendranagar (Surkhet) / Jumla" data-lead="Mountain & Mid-Hill Communities"
      d="M 145,85 L 230,45 L 295,90 L 265,180 L 210,195 L 175,130 Z"
      fill="#E9EEF3" stroke="#CBD2D9" stroke-width="2" />

    <!-- 3. Lumbini Province -->
    <path id="prov-lumbini" class="province-path" data-province="lumbini" data-name="Lumbini Province" data-districts="12" data-center="Butwal / Nepalgunj / Dang" data-lead="Western Terai & Valley Hub"
      d="M 155,200 L 210,195 L 265,180 L 330,220 L 375,235 L 340,300 L 230,305 L 125,230 Z"
      fill="#E9EEF3" stroke="#CBD2D9" stroke-width="2" />

    <!-- 4. Gandaki Province -->
    <path id="prov-gandaki" class="province-path" data-province="gandaki" data-name="Gandaki Province" data-districts="11" data-center="Pokhara / Gorkha / Baglung" data-lead="Central Himalayan Hub"
      d="M 295,90 L 390,65 L 475,125 L 435,210 L 375,235 L 330,220 L 265,180 Z"
      fill="#E9EEF3" stroke="#CBD2D9" stroke-width="2" />

    <!-- 5. Bagmati Province -->
    <path id="prov-bagmati" class="province-path" data-province="bagmati" data-name="Bagmati Province" data-districts="13" data-center="Kathmandu Valley / Hetauda / Chitwan" data-lead="Central Capital & Innovation Hub"
      d="M 475,125 L 590,135 L 610,220 L 555,260 L 490,265 L 435,210 Z"
      fill="#E9EEF3" stroke="#CBD2D9" stroke-width="2" />

    <!-- 6. Madhesh Province -->
    <path id="prov-madhesh" class="province-path" data-province="madhesh" data-name="Madhesh Province" data-districts="8" data-center="Janakpurdham / Birgunj / Lahan" data-lead="Southern Terai Cultural Hub"
      d="M 490,265 L 555,260 L 610,220 L 685,250 L 730,285 L 690,320 L 530,315 Z"
      fill="#E9EEF3" stroke="#CBD2D9" stroke-width="2" />

    <!-- 7. Koshi Province -->
    <path id="prov-koshi" class="province-path" data-province="koshi" data-name="Koshi Province" data-districts="14" data-center="Biratnagar / Dharan / Ilam" data-lead="Eastern Regional Hub"
      d="M 590,135 L 750,110 L 850,170 L 860,280 L 800,325 L 730,285 L 685,250 L 610,220 Z"
      fill="#E9EEF3" stroke="#CBD2D9" stroke-width="2" />
  </g>

  <!-- Network Interconnections (Connecting Alumni Nodes Across the Nation) -->
  <g class="network-links" stroke="#1565C0" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.65">
    <line x1="95" y1="180" x2="205" y2="145" />
    <line x1="205" y1="145" x2="230" y2="245" />
    <line x1="230" y1="245" x2="310" y2="260" />
    <line x1="310" y1="260" x2="380" y2="160" />
    <line x1="380" y1="160" x2="525" y2="190" />
    <line x1="525" y1="190" x2="600" y2="280" />
    <line x1="525" y1="190" x2="740" y2="225" />
    <line x1="600" y1="280" x2="775" y2="275" />
    <line x1="380" y1="160" x2="205" y2="145" />
  </g>

  <!-- Hub Nodes (Key Access Alumni Centers) -->
  <g class="network-nodes">
    <!-- Sudurpashchim Hub -->
    <g class="map-node" data-province="sudurpashchim" transform="translate(95, 180)">
      <circle r="9" fill="#1565C0" fill-opacity="0.2" />
      <circle r="5" fill="#1565C0" />
      <text x="0" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#102A43" text-anchor="middle">Dhangadhi</text>
    </g>

    <!-- Karnali Hub -->
    <g class="map-node" data-province="karnali" transform="translate(205, 145)">
      <circle r="9" fill="#1565C0" fill-opacity="0.2" />
      <circle r="5" fill="#1565C0" />
      <text x="0" y="-12" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#102A43" text-anchor="middle">Surkhet</text>
    </g>

    <!-- Lumbini Hub (Nepalgunj / Butwal) -->
    <g class="map-node" data-province="lumbini" transform="translate(230, 245)">
      <circle r="8" fill="#1565C0" fill-opacity="0.2" />
      <circle r="4.5" fill="#1565C0" />
      <text x="-5" y="18" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#102A43" text-anchor="middle">Nepalgunj</text>
    </g>
    <g class="map-node" data-province="lumbini" transform="translate(310, 260)">
      <circle r="8" fill="#1565C0" fill-opacity="0.2" />
      <circle r="4.5" fill="#1565C0" />
      <text x="5" y="18" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#102A43" text-anchor="middle">Butwal</text>
    </g>

    <!-- Gandaki Hub -->
    <g class="map-node" data-province="gandaki" transform="translate(380, 160)">
      <circle r="10" fill="#1565C0" fill-opacity="0.2" />
      <circle r="5.5" fill="#1565C0" />
      <text x="0" y="-12" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#102A43" text-anchor="middle">Pokhara</text>
    </g>

    <!-- Bagmati Hub (Kathmandu) -->
    <g class="map-node" data-province="bagmati" transform="translate(525, 190)">
      <circle r="12" fill="#D62828" fill-opacity="0.25" />
      <circle r="6" fill="#D62828" />
      <text x="0" y="-14" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#D62828" text-anchor="middle">Kathmandu</text>
    </g>

    <!-- Madhesh Hub -->
    <g class="map-node" data-province="madhesh" transform="translate(600, 280)">
      <circle r="9" fill="#1565C0" fill-opacity="0.2" />
      <circle r="5" fill="#1565C0" />
      <text x="0" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#102A43" text-anchor="middle">Janakpur</text>
    </g>

    <!-- Koshi Hub -->
    <g class="map-node" data-province="koshi" transform="translate(775, 275)">
      <circle r="9" fill="#1565C0" fill-opacity="0.2" />
      <circle r="5" fill="#1565C0" />
      <text x="0" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#102A43" text-anchor="middle">Biratnagar</text>
    </g>
    <g class="map-node" data-province="koshi" transform="translate(740, 225)">
      <circle r="8" fill="#1565C0" fill-opacity="0.2" />
      <circle r="4.5" fill="#1565C0" />
      <text x="25" y="4" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#102A43">Dharan</text>
    </g>
  </g>

  <!-- Province Name Badges in SVG -->
  <g font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#486581" opacity="0.85">
    <text x="95" y="125" text-anchor="middle">Sudurpashchim</text>
    <text x="205" y="90" text-anchor="middle">Karnali</text>
    <text x="260" y="235" text-anchor="middle">Lumbini</text>
    <text x="365" y="115" text-anchor="middle">Gandaki</text>
    <text x="545" y="150" text-anchor="middle">Bagmati</text>
    <text x="645" y="275" text-anchor="middle">Madhesh</text>
    <text x="735" y="170" text-anchor="middle">Koshi</text>
  </g>
</svg>
